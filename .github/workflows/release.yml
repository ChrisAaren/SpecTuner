# Builds the Windows installer on GitHub's machines and attaches it to a release.
#
# Two ways to run it:
#   - Push a tag that starts with "v" (for example v1.0.0). The installer is built with that
#     version and published as a release for the tag.
#   - Actions > Release > Run workflow. The installer is built and kept as a workflow artifact
#     that you can download from the run's page; no release is created.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      # For a tag build the version is the tag without its leading "v". Otherwise build.sh
      # stamps a dated version of its own.
      - name: Build and package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export SPECTUNER_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh --installer

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectuner-desktop-win-x64
          path: app/dist/desktop/spectuner-desktop-win-x64.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/desktop/spectuner-desktop-win-x64.exe
          generate_release_notes: true
